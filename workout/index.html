<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lift Log">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0a0b0d">
<meta name="robots" content="noindex">
<title>Lift Log</title>
<style>
:root{
  color-scheme: dark;
  --bg:#0a0b0d; --surface:#111317; --surface-2:#1a1d22; --line:#262a31; --grid:#1d2026;
  --text:#e9ecf1; --text-2:#a9b0bb; --text-3:#7d8591;
  --accent:#3987e5; --accent-ink:#ffffff; --accent-soft:#16263b;
  --series-1:#3987e5; --band:rgba(57,135,229,.16);
  --good:#3fb950; --warn:#d29922; --danger:#f06a6a;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --r: 8px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(150px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.top h1{font-size:22px;margin:0;letter-spacing:-.01em}
.top .sub{color:var(--text-3);font-size:13px}
h2{font-size:18px;margin:20px 0 8px}
h3{font-size:17px;margin:0}
.muted{color:var(--text-2)}
.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{width:100%;min-height:52px;font-size:17px}
.btn.danger{color:var(--danger)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding:0 8px}
.icon{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:22px;line-height:1;display:inline-flex;align-items:center;justify-content:center;flex:none}
.icon.flat{border:0;background:transparent;color:var(--text-3);font-size:18px}
/* date bar */
.datebar{display:flex;gap:8px;align-items:center}
.datepick{position:relative;flex:1;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:600}
.datepick input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.daysum{margin:10px 2px 0;color:var(--text-2);font-size:14px}
/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--text-2);white-space:nowrap}
.chip.p{background:var(--accent-soft);color:var(--text)}
/* exercise card */
.ex header{display:flex;gap:8px;align-items:flex-start}
.tags{font-size:13px;color:var(--text-2);margin-top:2px}
.tags b{font-weight:600;color:var(--text)}
.hint{margin-top:10px;font-size:14px;padding:8px 10px;border-radius:10px;background:var(--surface-2)}
.hint .k{font-weight:700}
.hint .up{color:var(--good)} .hint .down{color:var(--warn)} .hint .same{color:var(--accent)}
.hint .last{color:var(--text-3);font-size:13px;margin-top:2px}
.hint button{border:0;background:none;color:var(--accent);padding:0;font-size:13px}
.sets{list-style:none;margin:10px 0 0;padding:0}
.sets li{display:flex;align-items:center;gap:10px;padding:2px 0;border-top:1px solid var(--line)}
.sets li:first-child{border-top:0}
.sets .n{width:22px;color:var(--text-3);font-size:13px;text-align:center}
.sets .v{flex:1;font-variant-numeric:tabular-nums;font-weight:600}
.sets .e{color:var(--text-3);font-size:13px;font-weight:400}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.quick .add{grid-column:1/-1}
.stepper{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.stepper button{width:40px;border:0;background:var(--surface-2);font-size:20px;flex:none}
.stepper .f{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px 0}
.stepper input{width:100%;border:0;background:transparent;text-align:center;font-size:20px;font-weight:700;padding:0;font-variant-numeric:tabular-nums}
.stepper input:focus{outline:none}
.stepper:focus-within{border-color:var(--accent)}
.stepper label{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em}
.empty{text-align:center;color:var(--text-2);padding:28px 12px}
/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav.tabs .in{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;border:0;background:none;min-height:56px;font-size:12px;color:var(--text-3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
/* rest timer */
.timer{position:fixed;left:0;right:0;bottom:calc(57px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:19;pointer-events:none}
.timer[hidden]{display:none}
.timer .in{pointer-events:auto;margin:0 16px 8px;max-width:528px;width:100%;background:var(--text);color:var(--bg);border-radius:14px;display:flex;align-items:center;gap:8px;padding:6px 6px 6px 14px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.timer .t{flex:1;font-weight:700;font-variant-numeric:tabular-nums}
.timer button{min-height:40px;min-width:48px;border:0;border-radius:10px;background:rgba(127,127,127,.25);color:inherit;font-weight:600}
.timer.done .in{background:var(--good);color:#fff}
/* sheet */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet .panel{background:var(--bg);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet-head{display:flex;align-items:center;justify-content:space-between;position:sticky;top:-14px;background:var(--bg);padding:6px 0;z-index:1}
.sheet-head h2{margin:0}
.search{width:100%;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:16px}
.seg{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.pick{display:block;width:100%;text-align:left;padding:12px;border:0;border-bottom:1px solid var(--line);background:var(--surface)}
.pick:first-child{border-radius:12px 12px 0 0}.pick:last-child{border-radius:0 0 12px 12px;border-bottom:0}
.pick:only-child{border-radius:12px}
.pick .nm{font-weight:600}.pick .mu{font-size:13px;color:var(--text-2)}
.pick .in{float:right;font-size:12px;color:var(--good);font-weight:600}
.list{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.field{display:block;margin:12px 0}
.field > span{display:block;font-size:13px;color:var(--text-2);margin-bottom:4px}
.field select,.field input[type=text]{width:100%;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:16px}
.chk{display:inline-flex}
.chk input{position:absolute;opacity:0;pointer-events:none}
.chk span{font-size:14px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.chk input:checked + span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chk input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.mgroup{font-size:12px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;margin:10px 0 2px}
/* stats */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tile .l{font-size:13px;color:var(--text-2)}
.tile .v{font-size:22px;font-weight:650;margin-top:2px}
.tile .d{font-size:12px;color:var(--text-3)}
.tile .v .u{font-size:14px;font-weight:500;color:var(--text-2)}
.tiles.six{grid-template-columns:repeat(3,1fr)}
.chart{width:100%;margin-top:6px}
.chart svg{display:block;width:100%;touch-action:pan-y;overflow:visible}
.note{font-size:12px;color:var(--text-3);margin-top:6px}
select.pickex{width:100%;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:16px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--text-3);font-weight:600}
details summary{cursor:pointer;color:var(--accent);font-size:14px;padding:8px 0;min-height:44px;display:flex;align-items:center}
/* muscles */
.mrow{padding:8px 0;border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:0}
.mrow .top2{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.mrow .top2 b{font-variant-numeric:tabular-nums}
.bar{position:relative;height:10px;background:var(--surface-2);border-radius:0 4px 4px 0;margin-top:6px;overflow:hidden}
.bar .zone{position:absolute;top:0;bottom:0;background:var(--band);border-left:1px solid var(--series-1);border-right:1px solid var(--series-1);opacity:.9}
.bar .fill{position:absolute;left:0;top:2px;bottom:2px;background:var(--series-1);border-radius:0 4px 4px 0}
.mrow .src{font-size:12px;color:var(--text-3);margin-top:3px}
.stale{color:var(--warn)}
/* tooltip + toast */
#tip{position:fixed;z-index:40;pointer-events:none;background:var(--text);color:var(--bg);font-size:13px;padding:6px 9px;border-radius:8px;max-width:240px;line-height:1.35}
#tip[hidden]{display:none}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top));z-index:50;background:var(--text);color:var(--bg);border-radius:12px;padding:8px 8px 8px 14px;display:flex;gap:10px;align-items:center;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.2)}
#toast[hidden]{display:none}
#toast button{border:0;background:rgba(127,127,127,.3);color:inherit;border-radius:8px;min-height:36px;padding:0 12px;font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---- technical / data style ---- */
.card,.tile,.datepick,.icon,.btn,.stepper,.search,select.pickex,.field select,.field input[type=text],.list,.hint{border-radius:var(--r)}
.top h1{font-family:var(--mono);font-size:18px;letter-spacing:.08em;text-transform:uppercase}
.top h1::before{content:"▍";color:var(--accent)}
.top .sub,h3,.tile .l,.mgroup,th,nav.tabs button,.stepper label,.daysum{font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em}
h3{font-size:13px;color:var(--text-2);font-weight:600}
.ex h3{font-size:15px;color:var(--text);text-transform:none;letter-spacing:0;font-family:inherit}
h2{font-family:var(--mono);font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-2)}
.tile .l{font-size:11px}
.tile .v,.stepper input,.sets .v,.mrow .top2 b,table,.chip,.daysum,#timerText,.tile .d{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tile .v{font-weight:600}
.daysum{font-size:12px}
.chip{border-radius:4px;font-size:12px}
.chip.p{background:var(--accent-soft);color:#cfe3ff;box-shadow:inset 0 0 0 1px rgba(57,135,229,.35)}
.card{background:var(--surface);border-color:var(--line)}
.btn.primary{letter-spacing:.02em}
.seg button{border-radius:4px;font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
nav.tabs{background:#0d0f12}
nav.tabs button{font-size:10px}
.chart svg text{font-family:var(--mono)}
.timer .in{background:var(--surface-2);color:var(--text);border:1px solid var(--accent)}
.timer.done .in{background:#0f2a17;border-color:var(--good);color:var(--text)}
.bar{border-radius:0 2px 2px 0}.bar .fill{border-radius:0 2px 2px 0}
#tip{background:#e9ecf1;color:#0a0b0d;font-family:var(--mono);font-size:12px}
#toast{background:var(--surface-2);color:var(--text);border:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><h1 id="title">Lift Log</h1><div class="sub" id="subtitle"></div></div></div>
  <main id="view"></main>
</div>

<div class="timer" id="timer" hidden><div class="in"><span class="t" id="timerText">Rest 1:30</span><button data-act="timerAdj" data-d="-15">−15</button><button data-act="timerAdj" data-d="15">+15</button><button data-act="timerStop" aria-label="Stop rest timer">✕</button></div></div>

<nav class="tabs" aria-label="Sections"><div class="in" id="tabs"></div></nav>

<div class="sheet" id="sheet" hidden><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
<div id="tip" hidden></div>
<div id="toast" hidden role="status"><span id="toastText"></span><button id="toastBtn" hidden>Undo</button></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
'use strict';
/* ---------- Exercise library ---------- */
const GROUPS = {
  Chest: ['Chest', 'Upper chest'],
  Back: ['Lats', 'Upper back', 'Traps', 'Lower back'],
  Shoulders: ['Front delts', 'Side delts', 'Rear delts'],
  Arms: ['Biceps', 'Triceps', 'Forearms'],
  Legs: ['Quads', 'Hamstrings', 'Glutes', 'Calves', 'Adductors'],
  Core: ['Abs', 'Obliques']
};
const GROUP_OF = {};
for (const g in GROUPS) for (const m of GROUPS[g]) GROUP_OF[m] = g;
const ALL_MUSCLES = Object.values(GROUPS).flat();

// [name, group, main muscles, helper muscles, compound/isolation, weight step in lb]
const RAW = [
  ['Bench press', 'Chest', ['Chest'], ['Front delts', 'Triceps'], 'c', 5],
  ['Incline bench press', 'Chest', ['Upper chest'], ['Front delts', 'Triceps'], 'c', 5],
  ['Dumbbell bench press', 'Chest', ['Chest'], ['Front delts', 'Triceps'], 'c', 5],
  ['Incline dumbbell press', 'Chest', ['Upper chest'], ['Front delts', 'Triceps'], 'c', 5],
  ['Machine chest press', 'Chest', ['Chest'], ['Front delts', 'Triceps'], 'c', 5],
  ['Cable fly', 'Chest', ['Chest'], ['Front delts'], 'i', 5],
  ['Pec deck', 'Chest', ['Chest'], ['Front delts'], 'i', 5],
  ['Dips', 'Chest', ['Chest', 'Triceps'], ['Front delts'], 'c', 5],
  ['Push-up', 'Chest', ['Chest'], ['Front delts', 'Triceps'], 'c', 5],
  ['Deadlift', 'Back', ['Hamstrings', 'Glutes', 'Lower back'], ['Traps', 'Forearms', 'Quads', 'Upper back'], 'c', 10],
  ['Pull-up', 'Back', ['Lats'], ['Biceps', 'Upper back'], 'c', 5],
  ['Chin-up', 'Back', ['Lats', 'Biceps'], ['Upper back'], 'c', 5],
  ['Lat pulldown', 'Back', ['Lats'], ['Biceps', 'Upper back'], 'c', 5],
  ['Barbell row', 'Back', ['Upper back', 'Lats'], ['Biceps', 'Rear delts', 'Lower back'], 'c', 5],
  ['Dumbbell row', 'Back', ['Lats', 'Upper back'], ['Biceps', 'Rear delts'], 'c', 5],
  ['Seated cable row', 'Back', ['Upper back', 'Lats'], ['Biceps', 'Rear delts'], 'c', 5],
  ['T-bar row', 'Back', ['Upper back', 'Lats'], ['Biceps', 'Rear delts', 'Lower back'], 'c', 5],
  ['Shrug', 'Back', ['Traps'], ['Forearms'], 'i', 5],
  ['Back extension', 'Back', ['Lower back'], ['Glutes', 'Hamstrings'], 'i', 5],
  ['Overhead press', 'Shoulders', ['Front delts'], ['Side delts', 'Triceps', 'Upper chest'], 'c', 5],
  ['Dumbbell shoulder press', 'Shoulders', ['Front delts'], ['Side delts', 'Triceps'], 'c', 5],
  ['Lateral raise', 'Shoulders', ['Side delts'], [], 'i', 5],
  ['Cable lateral raise', 'Shoulders', ['Side delts'], [], 'i', 5],
  ['Rear delt fly', 'Shoulders', ['Rear delts'], ['Upper back'], 'i', 5],
  ['Face pull', 'Shoulders', ['Rear delts'], ['Upper back', 'Traps'], 'i', 5],
  ['Front raise', 'Shoulders', ['Front delts'], [], 'i', 5],
  ['Barbell curl', 'Arms', ['Biceps'], ['Forearms'], 'i', 5],
  ['Dumbbell curl', 'Arms', ['Biceps'], ['Forearms'], 'i', 5],
  ['Hammer curl', 'Arms', ['Biceps', 'Forearms'], [], 'i', 5],
  ['Preacher curl', 'Arms', ['Biceps'], [], 'i', 5],
  ['Cable curl', 'Arms', ['Biceps'], ['Forearms'], 'i', 5],
  ['Tricep pushdown', 'Arms', ['Triceps'], [], 'i', 5],
  ['Skull crusher', 'Arms', ['Triceps'], [], 'i', 5],
  ['Overhead tricep extension', 'Arms', ['Triceps'], [], 'i', 5],
  ['Close-grip bench press', 'Arms', ['Triceps', 'Chest'], ['Front delts'], 'c', 5],
  ['Wrist curl', 'Arms', ['Forearms'], [], 'i', 5],
  ['Back squat', 'Legs', ['Quads', 'Glutes'], ['Adductors', 'Lower back'], 'c', 10],
  ['Front squat', 'Legs', ['Quads'], ['Glutes', 'Abs', 'Upper back'], 'c', 10],
  ['Leg press', 'Legs', ['Quads', 'Glutes'], ['Adductors'], 'c', 10],
  ['Hack squat', 'Legs', ['Quads'], ['Glutes'], 'c', 10],
  ['Bulgarian split squat', 'Legs', ['Quads', 'Glutes'], ['Adductors', 'Hamstrings'], 'c', 5],
  ['Lunge', 'Legs', ['Quads', 'Glutes'], ['Hamstrings', 'Adductors'], 'c', 5],
  ['Romanian deadlift', 'Legs', ['Hamstrings', 'Glutes'], ['Lower back', 'Forearms'], 'c', 10],
  ['Hip thrust', 'Legs', ['Glutes'], ['Hamstrings'], 'c', 10],
  ['Leg extension', 'Legs', ['Quads'], [], 'i', 5],
  ['Leg curl', 'Legs', ['Hamstrings'], [], 'i', 5],
  ['Standing calf raise', 'Legs', ['Calves'], [], 'i', 5],
  ['Seated calf raise', 'Legs', ['Calves'], [], 'i', 5],
  ['Hip adduction', 'Legs', ['Adductors'], [], 'i', 5],
  ['Crunch', 'Core', ['Abs'], [], 'i', 5],
  ['Cable crunch', 'Core', ['Abs'], [], 'i', 5],
  ['Hanging leg raise', 'Core', ['Abs'], ['Obliques'], 'i', 5],
  ['Russian twist', 'Core', ['Obliques'], ['Abs'], 'i', 5]
];
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const BASE = RAW.map(([n, g, p, s, t, inc]) => ({ id: slug(n), n, g, p, s, t, inc }));

/* ---------- Storage (this phone only) ---------- */
const KEY = 'liftlog.v1';
const DEFAULTS = () => ({ v: 1, unit: 'lb', rest: 90, sessions: [], custom: [], ranges: {} });
function normalize(d) {
  const o = Object.assign(DEFAULTS(), d);
  o.sessions = (o.sessions || []).filter(s => s && /^\d{4}-\d{2}-\d{2}$/.test(s.date)).map(s => ({
    date: s.date,
    entries: (s.entries || []).filter(e => e && e.ex).map(e => ({
      ex: String(e.ex),
      sets: (e.sets || []).map(x => ({ w: +x.w || 0, r: Math.max(0, Math.round(+x.r || 0)) }))
    }))
  }));
  o.custom = (o.custom || []).filter(c => c && c.id && c.n && Array.isArray(c.p));
  o.ranges = o.ranges && typeof o.ranges === 'object' ? o.ranges : {};
  if (o.unit !== 'kg') o.unit = 'lb';
  return o;
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return normalize(JSON.parse(raw));
  } catch (e) {}
  return DEFAULTS();
}
let S = load();
let saveFailed = false;
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); saveFailed = false; }
  catch (e) { if (!saveFailed) toast('Could not save on this device. Download a backup from More.'); saveFailed = true; }
}
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}

let LIB = new Map();
function rebuildLib() {
  LIB = new Map();
  for (const e of BASE) LIB.set(e.id, e);
  for (const c of S.custom) LIB.set(c.id, c);
}
rebuildLib();
const EX = id => LIB.get(id) || { id, n: id, g: 'Other', p: [], s: [], t: 'i', inc: 5 };
const rangeOf = ex => S.ranges[ex.id] || (ex.t === 'c' ? [6, 10] : [10, 15]);
const incOf = ex => S.unit === 'kg' ? ex.inc / 2 : ex.inc;

/* ---------- Helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const dayNum = s => { const [y, m, d] = s.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / 864e5); };

function fmtDate(s, long) {

}
function dayTitle(s) {

}
const fmtN = n => (Math.round(n * 10) / 10).toLocaleString(undefined, { maximumFractionDigits: 1 });
const fmtW = w => w === 0 ? 'bodyweight' : `${fmtN(w)} ${S.unit}`;
const roundTo = (v, step) => Math.round(v / step) * step;

const sortedSessions = () => [...S.sessions].sort((a, b) => b.date.localeCompare(a.date));
const getSession = d => S.sessions.find(s => s.date === d);

/* ---------- Progression model (double progression) ---------- */
function suggest(exId, date) {
  const ex = EX(exId), [lo, hi] = rangeOf(ex), inc = incOf(ex);
  const h = exHistory(exId, date);
  if (!h.length) return { w: '', r: lo, kind: 'new', text: `New lift: pick a weight you can do for ${lo}–${hi} reps with 1–2 reps left in the tank.` };
  const top = sets => Math.max(...sets.map(s => s.w));
  const working = (sets, w) => sets.filter(s => s.w === w).map(s => s.r);
  const last = h[0], w = top(last.sets), reps = working(last.sets, w);
  const lastLine = `Last time (${fmtDate(last.date)}): ${summarizeSets(last.sets)}`;
  if (reps.every(r => r >= hi)) {
    return { w: w + inc, r: lo, kind: 'up', lastLine,
      text: `Level up: you hit ${hi}+ reps on every set. Go to ${fmtW(w + inc)} × ${lo}.` };
  }
  const prev = h[1];
  if (w > 0 && Math.min(...reps) < lo && prev && top(prev.sets) === w && Math.min(...working(prev.sets, w)) < lo) {
    const dw = Math.max(0, roundTo(w * 0.9, inc / 2 || 1));
    return { w: dw, r: hi, kind: 'down', lastLine,
      text: `Deload: under ${lo} reps two sessions in a row at ${fmtW(w)}. Drop to ${fmtW(dw)} and build back up.` };
  }
  const r = Math.min(Math.max(...reps) + 1, hi);
  return { w, r, kind: 'same', lastLine,
    text: `Beat last time: stay at ${fmtW(w)}, aim for ${r} reps. Hit ${hi} on every set, then add ${fmtN(inc)} ${S.unit}.` };
}

/* ---------- Muscles ---------- */
function sessionMuscles(entries) {
  const m = {};
  for (const e of entries) {
    const ex = EX(e.ex), n = e.sets.length;
    if (!n) continue;
    for (const mu of ex.p) { m[mu] = m[mu] || { v: 0, p: false }; m[mu].v += n; m[mu].p = true; }
    for (const mu of ex.s) { m[mu] = m[mu] || { v: 0, p: false }; m[mu].v += n / 2; }
  }
  return Object.entries(m).sort((a, b) => (b[1].p - a[1].p) || (b[1].v - a[1].v));
}
function muscleChips(entries) {
  const list = sessionMuscles(entries);
  if (!list.length) return '';

}

}
function linfit(pts) {
  const n = pts.length, mt = pts.reduce((a, p) => a + p.t, 0) / n, my = pts.reduce((a, p) => a + p.y, 0) / n;

  return linfit(use);

function drawProgress() {

  for (const s of S.sessions) {
    const w = weeks.find(x => { const d = dayNum(s.date); return d >= x.start && d < x.start + 7; });
    if (!w) continue;
    const n = s.entries.reduce((a, e) => a + e.sets.length, 0);
    w.sets += n; if (n) w.days++;

  const wEl = $('#chWeeks');
  if (wEl) columnChart(wEl, weeks.map(w => ({ label: fmtDate(numToStr(w.start)), v: w.sets,

  const id = ui.progEx;

  const bw = isBodyweight(id);
  const hist = exHistory(id).slice().reverse();
  const pts = hist.map(h => {

    const y = bw ? b.r : Math.round(e1rm(b));
    return { t: dayNum(h.date), y, tip: `<b>${fmtDate(h.date)}</b><br>${bw ? 'Best: ' + b.r + ' reps' : 'Est. max ' + fmtN(y) + ' ' + S.unit + '<br>Best set ' + fmtN(b.w) + '×' + b.r}` };
  });

}

function renderMuscles() {
  const today = dayNum(todayStr()), days = ui.mRange, from = today - days + 1, weeks = days / 7;
  const sets = {}, src = {}, last = {}, grp = {};
  for (const s of S.sessions) {
    const d = dayNum(s.date);
    for (const e of s.entries) {
      const ex = EX(e.ex), n = e.sets.length;
      if (!n) continue;
      const inR = d >= from && d <= today;
      for (const mu of ex.p) {
        last[mu] = Math.max(last[mu] ?? -1e9, d);
        if (inR) { sets[mu] = (sets[mu] || 0) + n; (src[mu] = src[mu] || {})[ex.n] = 1; }
      }
      for (const mu of ex.s) if (inR) { sets[mu] = (sets[mu] || 0) + n / 2; (src[mu] = src[mu] || {})[ex.n] = 1; }

    }
  }

  const ago = mu => {

    <div class="tiles six">${Object.keys(GROUPS).map(g => `<div class="tile"><div class="l">${g}</div><div class="v">${fmtN(perWk(grp[g]))}</div><div class="d">sets/wk</div></div>`).join('')}</div>

  for (const [g, ms] of Object.entries(GROUPS)) {
    h += `<section class="card"><h3>${g}</h3>` + ms.map(mu => {
      const v = perWk(sets[mu]);
      return `<div class="mrow"><div class="top2"><span>${mu}</span><span><b>${fmtN(v)}</b> <span class="muted small">sets/wk · ${ago(mu)}</span></span></div>
        <div class="bar" aria-hidden="true"><div class="zone" style="left:${pct(10)}%;width:${pct(20) - pct(10)}%"></div><div class="fill" style="width:${pct(v)}%"></div></div>

    }).join('') + `</section>`;
  }
  return h;
}

        S = d; rebuildLib(); save(); render(); toast('Backup restored.', u);
      } catch (err) { toast("That file isn't a Lift Log backup."); }
    };
    rd.readAsText(t.files[0]);
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet();
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.f) {
    const i = e.target.id.split('-')[1];
    if (e.target.dataset.f === 'w') $('#r-' + i).focus();
    else { e.target.blur(); ACT.addSet({ dataset: { i } }); }
  }
});
addEventListener('scroll', hideTip, { passive: true });
let rsz;
addEventListener('resize', () => { clearTimeout(rsz); rsz = setTimeout(() => { if (ui.tab === 'progress') drawProgress(); }, 150); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && timerEnd) tickTimer(); });

render();
</script>
